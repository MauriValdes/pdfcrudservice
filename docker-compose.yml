services:
  # ---------------------------------------------------------------
  # Persistencia (MongoDB)
  # ---------------------------------------------------------------
  db:
    image: mongo:8.0
    container_name: pdf_mongo_db
    restart: always
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------
  # Traefik como API Gateway (puerto 80)
  # ---------------------------------------------------------------
  traefik:
    image: traefik:v3
    container_name: pdf_traefik
    restart: always
    ports:
      - "80:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8081}:8080"
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.transport.respondingTimeouts.readTimeout=60s
      - --entrypoints.web.transport.respondingTimeouts.writeTimeout=60s
      - --api.insecure=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # ---------------------------------------------------------------
  # Document Service (API FastAPI - MS3 pdf-crud-service)
  # ---------------------------------------------------------------
  document-service:
    build: .
    # OJO: con replicas > 1 NO se puede fijar container_name ni un puerto
    # de host estático (Docker Compose falla por colisión entre réplicas).
    # El punto de entrada externo es Traefik (puerto 80), que balancea
    # entre las réplicas automáticamente.
    # Para modo single-instance con puerto directo (benchmark comparativo):
    #   docker compose -f docker-compose.yml -f docker-compose.single.yml up
    restart: unless-stopped
    deploy:
      replicas: 5
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    depends_on:
      db:
        condition: service_healthy
    environment:
      # --- MongoDB ---
      - MONGO_URL=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@db:27017/?authSource=admin
      - MONGO_DB_DEV=${MONGO_DB_DEV:-pdf_database_dev}
      - MONGO_DB_TEST=${MONGO_DB_TEST:-pdf_database_test}
      - MONGO_COLLECTION=${MONGO_COLLECTION:-processed_pdfs}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-5}
    labels:
      # Etiquetas de Traefik para enrutar el puerto 80 hacia este servicio
      - traefik.enable=true
      - traefik.http.routers.document-service.rule=Host(`localhost`) || Host(`extract.universidad.localhost`)
      - traefik.http.routers.document-service.entrypoints=web
      - traefik.http.services.document-service.loadbalancer.server.port=8000

volumes:
  mongo_data: